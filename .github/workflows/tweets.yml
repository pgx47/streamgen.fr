name: X/Twitter alerts

on:
  schedule:
    - cron: '10,40 * * * *' # 2x/heure : couvre la fenetre H-15min
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tweets:
    runs-on: ubuntu-latest
    if: ${{ vars.X_ALERTS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/tweet_alert.py
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Persist state
        run: |
          git config user.name "streamgen-bot"
          git config user.email "bot@streamgen.fr"
          git add scripts/.tweets_sent.json
          git diff --cached --quiet || git commit -m "chore: tweets state"
          git push
