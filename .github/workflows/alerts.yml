name: Telegram alerts

on:
  schedule:
    - cron: '*/15 * * *' # toutes les 15 min : alerte ~1h avant le direct
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    if: ${{ vars.TELEGRAM_ALERTS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/telegram_alerts.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist alert state
        run: |
          git config user.name "streamgen-bot"
          git config user.email "bot@streamgen.fr"
          git add scripts/.alerts_sent.json
          git diff --cached --quiet || git commit -m "chore: alerts state [skip ci]"
          git push
