name: News droits TV

on:
  schedule:
    - cron: '0 6 * * 3,6' # mercredi et samedi 06h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_news.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
      - name: Ping Google Indexing API (URLs modifiées)
        if: always()
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/google_index.py || true

      - name: Commit news
        run: |
          git config user.name "streamgen-bot"
          git config user.email "bot@streamgen.fr"
          git add src/content/news/ scripts/.news_seen.json
          git diff --cached --quiet || git commit -m "news: droits TV [bot]"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "::error::Unable to push generated content after 3 attempts"
          exit 1
  deploy:
    needs: news
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
