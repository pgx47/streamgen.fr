name: Collect official calendars
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-calendar-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/collect.mjs
        continue-on-error: true
      - name: Daily LLM budget key
        id: budget
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: llm_budget
        with:
          path: work/llm-budget
          key: deepseek-daily-${{ steps.budget.outputs.day }}
      - name: Reserve daily LLM request before any paid call
        if: steps.llm_budget.outputs.cache-hit != 'true'
        run: mkdir -p work/llm-budget && touch work/llm-budget/reserved
      - uses: actions/cache/save@v4
        id: reserve
        if: steps.llm_budget.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: work/llm-budget
          key: deepseek-daily-${{ steps.budget.outputs.day }}
      - uses: actions/cache/restore@v4
        id: verify_reservation
        if: steps.llm_budget.outputs.cache-hit != 'true'
        with:
          path: work/llm-budget
          key: deepseek-daily-${{ steps.budget.outputs.day }}
      - run: node scripts/collect-feeds.mjs
        env:
          LLM_BUDGET_ALLOWED: ${{ steps.llm_budget.outputs.cache-hit != 'true' && steps.verify_reservation.outputs.cache-hit == 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: Collect Riot VALORANT matches
        run: node scripts/collect-riot.mjs
      - name: Discover Red Bull TV livestreams
        run: node scripts/collect-redbull.mjs
      - name: Collect ARTE weekly TV guide
        run: node scripts/collect-arte.mjs
      - name: Discover and validate event images
        run: node scripts/collect-images.mjs
      - run: npm run build
      - name: Commit validated data
        id: commit
        run: |
          git config user.name streamgen-bot
          git config user.email bot@streamgen.fr
          git add public/events.json public/sources.json public/collection-status.json data/collection-cache.json public/automatic-images.json public/image-collection-status.json data/image-cache.json public/assets/auto-images
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'data: refresh verified official calendars'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-report
          path: |
            work/collection-run.json
            work/feeds-run.json
            work/images-run.json
            work/arte-run.json
            work/riot-run.json
            work/redbull-run.json
          retention-days: 14
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.collect.outputs.revision }}
    secrets: inherit
    permissions:
      contents: read
