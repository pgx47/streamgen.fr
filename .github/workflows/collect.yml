name: Collect official calendars
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-calendar-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/collect.mjs
        id: collect
        continue-on-error: true
      - name: Daily LLM budget key
        id: budget
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: llm_budget
        with:
          path: work/llm-budget
          key: deepseek-daily-${{ steps.budget.outputs.day }}
      - name: Reserve daily LLM request before any paid call
        if: steps.llm_budget.outputs.cache-hit != 'true'
        run: mkdir -p work/llm-budget && touch work/llm-budget/reserved
      - uses: actions/cache/save@v4
        id: reserve
        if: steps.llm_budget.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: work/llm-budget
          key: deepseek-daily-${{ steps.budget.outputs.day }}
      - uses: actions/cache/restore@v4
        id: verify_reservation
        if: steps.llm_budget.outputs.cache-hit != 'true'
        with:
          path: work/llm-budget
          key: deepseek-daily-${{ steps.budget.outputs.day }}
      - run: node scripts/collect-feeds.mjs
        id: collect_feeds
        continue-on-error: true
        env:
          LLM_BUDGET_ALLOWED: ${{ steps.llm_budget.outputs.cache-hit != 'true' && steps.verify_reservation.outputs.cache-hit == 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: Collect Riot VALORANT matches
        run: node scripts/collect-riot.mjs
        id: collect_riot
        continue-on-error: true
      - name: Discover Red Bull TV livestreams
        run: node scripts/collect-redbull.mjs
        id: collect_redbull
        continue-on-error: true
      - name: Collect public science conferences and live concerts
        run: node scripts/collect-discoveries.mjs
        id: collect_discoveries
        continue-on-error: true
      - name: Collect official launch windows and independently cross-check schedules
        run: node scripts/collect-space.mjs
        id: collect_space
        continue-on-error: true
      - name: Discover france.tv weekly sports broadcasts
        run: node scripts/collect-france-sport.mjs
        id: collect_france_sport
        continue-on-error: true
      - name: Collect scheduled YouTube livestreams from official channels
        run: node scripts/collect-youtube.mjs
        id: collect_youtube
        continue-on-error: true
      - name: Collect Liquipedia esports match schedules
        run: node scripts/collect-liquipedia.mjs
        id: collect_liquipedia
        continue-on-error: true
      - name: Collect start.gg French tournaments
        run: node scripts/collect-startgg.mjs
        id: collect_startgg
        continue-on-error: true
        env:
          STARTGG_API_KEY: ${{ secrets.STARTGG_API_KEY }}
      - name: Collect PandaScore matches for uncovered games
        run: node scripts/collect-pandascore.mjs
        id: collect_pandascore
        continue-on-error: true
        env:
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
      - name: Collect Lichess broadcast tournaments
        run: node scripts/collect-lichess.mjs
        id: collect_lichess
        continue-on-error: true
      - name: Collect Oengus speedrun marathons
        run: node scripts/collect-oengus.mjs
        id: collect_oengus
        continue-on-error: true
      - name: AI-assisted extraction from unstructured official pages
        run: node scripts/collect-ai.mjs
        id: collect_ai
        continue-on-error: true
        env:
          LLM_BUDGET_ALLOWED: ${{ steps.llm_budget.outputs.cache-hit != 'true' && steps.verify_reservation.outputs.cache-hit == 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: Discover PGL tournaments and corroborate Counter-Strike matches
        run: node scripts/collect-pgl.mjs
        id: collect_pgl
        continue-on-error: true
      - name: Discover and validate event images
        run: node scripts/collect-images.mjs
        id: collect_images
        continue-on-error: true
      - run: npm run build
      - name: Commit validated data
        id: commit
        run: |
          git config user.name streamgen-bot
          git config user.email bot@streamgen.fr
          git add public/events.json public/sources.json public/collection-status.json data/collection-cache.json public/automatic-images.json public/image-collection-status.json data/image-cache.json public/assets/auto-images
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'data: refresh verified official calendars'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-report
          path: |
            work/collection-run.json
            work/feeds-run.json
            work/images-run.json
            work/riot-run.json
            work/redbull-run.json
            work/discoveries-run.json
            work/space-run.json
            work/france-sport-run.json
            work/youtube-run.json
            work/liquipedia-run.json
            work/startgg-run.json
            work/pandascore-run.json
            work/lichess-run.json
            work/oengus-run.json
            work/ai-run.json
            work/pgl-run.json
          retention-days: 14
      - name: Report collector failures after preserving validated updates
        if: always()
        env:
          COLLECTION_STEPS: ${{ toJSON(steps) }}
        run: node scripts/check-collection-steps.mjs
  deploy:
    needs: collect
    if: always() && needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.collect.outputs.revision }}
    secrets: inherit
    permissions:
      contents: read
