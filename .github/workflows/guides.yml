name: Auto guides

on:
  schedule:
    - cron: '0 7 * * 1,3,5' # lun/mer/ven 07h UTC = ~3/semaine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generate_guide.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
      - name: Commit guide
        run: |
          git config user.name "streamgen-bot"
          git config user.email "bot@streamgen.fr"
          git add src/content/guides/
          git diff --cached --quiet || git commit -m "guide: auto [bot]"
          git push
  deploy:
    needs: guides
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
