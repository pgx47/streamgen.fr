name: Update fixtures

on:
  schedule:
    - cron: '0 4 * * *' # quotidien 04h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Fetch upcoming fixtures
        run: python scripts/fetch_fixtures.py
        env:
          THESPORTSDB_KEY: ${{ vars.THESPORTSDB_KEY || '123' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
      - name: Update statuses
        run: python scripts/fetch_fixtures.py --update-status
      - name: Ping Google Indexing API (URLs modifiées)
        if: always()
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/google_index.py || true

      - name: Commit changes
        run: |
          git config user.name "streamgen-bot"
          git config user.email "bot@streamgen.fr"
          git add src/content/matches/
          git diff --cached --quiet || git commit -m "chore: update fixtures [bot]"
          git push
  deploy:
    needs: fixtures
    if: always()
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
